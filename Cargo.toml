[package]
name = "narraverse"
version = "0.4.31"
authors = ["MaeroMono"]
edition = "2024"
license = "GPL-3.0"
description = "A no-BS TUI for worldbuilding."
repository = "https://codeberg.org/maeromono/narraverse"
homepage = "https://maero.surge.sh/projects/narraverse/"
readme = "README.md"
keywords = ["tui", "worldbuilding", "creative"]
categories = ["command-line-interface", "command-line-utilities"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
directories = "6.0.0"
enum-iterator = "2.3.0"
indexmap = { version = "2.14.2", features = ["serde"] }
ratatui = "0.30.2"
ratatui-textarea = { version = "0.9.4", features = ["search"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["serde_derive"] }
toml = { version = "1.1.6", features = ["preserve_order"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
